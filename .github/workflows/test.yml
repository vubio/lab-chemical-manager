name: Lab Chemical Manager tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check plate.js
          node --check plate_reader.js
          node --check github_sync.js
      - name: Test dosing calculations
        run: node tests/dosing.test.js
      - name: Test plate layouts
        run: node tests/plate.test.js
      - name: Test plate-reader data matching and exports
        run: node tests/plate_reader.test.js
      - name: Test GitHub data synchronization and conflict safety
        run: node tests/github_sync.test.js
