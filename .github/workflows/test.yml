name: Dosing calculator tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test dosing calculations
        run: node tests/dosing.test.js
